name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: opslens, POSTGRES_PASSWORD: opslens, POSTGRES_DB: opslens }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opslens" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://opslens:opslens@localhost:5432/opslens
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: psql postgres://opslens:opslens@localhost:5432/opslens -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: npm run db:push -- --force
      - run: npm run build
