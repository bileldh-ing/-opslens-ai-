name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # Unit + integration tests. Integration runs on embedded Postgres (PGlite + pgvector).
      - run: npm test
      # Golden investigation cases (deterministic triage when no model key is configured).
      - run: npm run eval
        env: { DATABASE_URL: "pglite://.data/eval" }

  postgres:
    name: Migrations + build against real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: opslens, POSTGRES_PASSWORD: opslens, POSTGRES_DB: opslens }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opslens" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://opslens:opslens@localhost:5432/opslens
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
