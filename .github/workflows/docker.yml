name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "package-lock.json", ".github/workflows/docker.yml"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  # Never cancel a publish in flight on main/tags; superseded PR builds can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/bileldh-ing/opslens-ai

jobs:
  image:
    name: Build, scan and push image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: opslens-ai:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container health
        run: |
          docker run -d --name opslens -p 3000:3000 -e DATABASE_URL=pglite:///tmp/opslens opslens-ai:scan
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health
          docker inspect --format '{{.Config.User}}' opslens-ai:scan | grep -qv '^$'
          docker logs opslens | tail -20
          docker rm -f opslens
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opslens-ai:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload Trivy results to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Trivy gate (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opslens-ai:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Build and push (multi-arch, SBOM + provenance)
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
